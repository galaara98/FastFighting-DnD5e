name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The tests import FastFighting Core from a checkout beside this one (see vitest.config.js).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: FastFighting-DnD5e

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: galaara98/FastFighting
          path: FastFighting

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FastFighting-DnD5e/package-lock.json

      - run: npm ci
        working-directory: FastFighting-DnD5e
      - run: npm test
        working-directory: FastFighting-DnD5e
      - run: npm run test:reworded
        working-directory: FastFighting-DnD5e
