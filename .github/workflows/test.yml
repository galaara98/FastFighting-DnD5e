name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The tests import FastFighting Core from a checkout beside this one (see vitest.config.js).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: FastFighting-DnD5e

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: galaara98/FastFighting
          path: FastFighting

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FastFighting-DnD5e/package-lock.json

      - run: npm ci
        working-directory: FastFighting-DnD5e
      - run: npm test
        working-directory: FastFighting-DnD5e
      - run: npm run test:reworded
        working-directory: FastFighting-DnD5e
