name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default: only the job that publishes may write.
permissions:
  contents: read

jobs:
  # The tests run with read-only rights: npm ci and the tests run code from the registry.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: FastFighting-DnD5e
          persist-credentials: false

      # The tests import FastFighting Core from a checkout beside this one.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: galaara98/FastFighting
          path: FastFighting
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FastFighting-DnD5e/package-lock.json

      - name: Test
        working-directory: FastFighting-DnD5e
        run: |
          npm ci
          npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: FastFighting-DnD5e
          persist-credentials: false

      - name: Set version and download URL in module.json
        working-directory: FastFighting-DnD5e
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" \
             --arg d "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/module.zip" \
             '.version = $v | .download = $d' module.json > module.tmp && mv module.tmp module.json

      # Only what Foundry loads, with the README and the license. Coders get the rest from the repository.
      - name: Build module.zip
        working-directory: FastFighting-DnD5e
        run: |
          zip -r module.zip module.json scripts languages hardcoded-toEN.json README.md LICENSE
          unzip -l module.zip

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            FastFighting-DnD5e/module.json
            FastFighting-DnD5e/module.zip
